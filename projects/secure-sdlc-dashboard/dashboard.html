<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure SDLC Dashboard</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f7f8f5; color: #17201d; }
    main { padding: 32px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 12px; }
    .card { background: white; border: 1px solid #dfe5df; border-radius: 8px; padding: 16px; }
    .value { display: block; color: #0b6b57; font-size: 2rem; font-weight: 900; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { border: 1px solid #dfe5df; padding: 10px; text-align: left; }
    @media (max-width: 800px) { .metrics { grid-template-columns: 1fr 1fr; } }
  </style>
  <main>
    <h1>Secure SDLC Dashboard</h1>
    <section class="metrics" id="metrics"></section>
    <table>
      <thead><tr><th>Application</th><th>Risk</th><th>Owner</th><th>Status</th><th>SLA</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    const vulns = [
      { app: "Payments API", risk: "Critical", owner: "Backend", status: "In remediation", sla: "2 days" },
      { app: "Admin Portal", risk: "High", owner: "Web", status: "Open", sla: "5 days" },
      { app: "Mobile API", risk: "Medium", owner: "Platform", status: "Fixed", sla: "Met" },
      { app: "CI Pipeline", risk: "High", owner: "DevOps", status: "Open", sla: "3 days" }
    ];
    const open = vulns.filter(v => v.status !== "Fixed").length;
    const critical = vulns.filter(v => v.risk === "Critical").length;
    const fixed = vulns.filter(v => v.status === "Fixed").length;
    const metrics = [
      ["Open Findings", open], ["Critical", critical], ["Fixed", fixed], ["Tracked Apps", new Set(vulns.map(v => v.app)).size]
    ];
    document.querySelector("#metrics").innerHTML = metrics.map(([label, value]) => `<div class="card"><span class="value">${value}</span>${label}</div>`).join("");
    document.querySelector("#rows").innerHTML = vulns.map(v => `<tr><td>${v.app}</td><td>${v.risk}</td><td>${v.owner}</td><td>${v.status}</td><td>${v.sla}</td></tr>`).join("");
  </script>
</html>
